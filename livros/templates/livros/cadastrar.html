<!DOCTYPE html>
<html lang="pt-br">
<head><meta charset="UTF-8"><title>Cadastro de Livros</title></head>
<body>
    {% include 'alunos/navegacao.html' %}
    <h1>Cadastro de Livros</h1>
    <form method="POST">
        {% csrf_token %}
        <p><input type="text" name="titulo" placeholder="Título" required></p>
        <p><input type="text" name="autor" placeholder="Autor" required></p>
        <p><input type="text" name="editora" placeholder="Editora" required></p>
        <p><input type="number" name="ano_publicacao" placeholder="Ano de publicação" required></p>
        <p><input type="text" name="isbn" placeholder="ISBN" maxlength="13" required></p>
        <button type="submit">Cadastrar</button>
    </form>
    <a href="{% url 'listar_livros' %}">Listar livros</a>
</body>
</html>
